name: Update CB Dashboard

on:
  schedule:
    # UTC 11:30 = 台灣 19:30，週一到週五（TPEx 傍晚更新完後）
    - cron: "30 11 * * 1-5"
  workflow_dispatch:   # 保留手動觸發按鈕，隨時可補跑

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch daily CB snapshot
        run: python cb_snapshot_ingest.py --db cb_openapi.db

      - name: Generate dashboard
        run: python generate_cb_html.py --db cb_openapi.db --out index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cb_openapi.db index.html
          if git diff --cached --quiet; then
            echo "No changes, skip commit."
          else
            git commit -m "Daily CB snapshot $(date +'%Y-%m-%d')"
            git push
          fi
